services:
  - type: web
    name: typohunter
    runtime: node
    plan: free
    branch: master
    # The OpenCode CLI is NOT installed on this free instance: `opencode serve`
    # is a ~186MB Bun process that exceeds the 512MB free-tier limit (verified —
    # Render restarted the service on OOM). Hosted therefore uses gemini/groq;
    # OpenCode still leads locally where the CLI already runs.
    buildCommand: npm ci
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: LLM_ORDER
        value: gemini,groq
      - key: REVIEWER_EMAIL
        value: substack.proofreader@proton.me
      - key: REVIEWER_SID
        sync: false
      - key: SUBSTACK_SID
        sync: false
      - key: SMOKE_PUB
        value: danielloureno.substack.com
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
