# Typo proofreading task, composed from _base + snippets (Akita-style:
# `system` + `template` + `includes`). The builder joins every `system`
# section with a blank line: base first, includes in order, this task last.
#
# `template` is the user message with {placeholders} filled per call.
# `language_note` is appended to the system message only when a language is
# passed in (translation editions); {language} is interpolated the same way.

system: |
  Proofread the excerpt in the user message.

template: |
  {text}

language_note: |
  The text is written in language "{language}". Apply that language's spelling/grammar rules; never convert it to another language.

includes:
  - _base
  - snippets/markers
  - snippets/placeholders
  - snippets/captions
  - snippets/json_only
